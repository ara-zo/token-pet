<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Pet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Silkscreen:wght@400;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body class="collapsed">

<!-- 접힌 상태 120×120 -->
<section id="collapsed" class="collapsed-view pet-host">
  <div id="earn-bubble" class="earn-bubble hidden">+0</div>
  <button id="mail-small" class="mail-bubble hidden" type="button" aria-label="PR 우편함 열기"><svg class="mail-ico" viewBox="0 0 14 10" width="14" height="10" aria-hidden="true"><rect x="0" y="0" width="14" height="10" fill="currentColor"/><rect x="1" y="1" width="12" height="8" fill="#F4F1FF"/><rect x="2" y="2" width="2" height="1" fill="currentColor"/><rect x="4" y="3" width="2" height="1" fill="currentColor"/><rect x="6" y="4" width="2" height="1" fill="currentColor"/><rect x="8" y="3" width="2" height="1" fill="currentColor"/><rect x="10" y="2" width="2" height="1" fill="currentColor"/></svg><span id="mail-count-small">우편</span></button>
  <div id="mail-letter" class="mail-letter hidden" aria-hidden="true"><svg viewBox="0 0 18 13" width="18" height="13"><rect x="0" y="0" width="18" height="13" fill="#23203A"/><rect x="1" y="1" width="16" height="11" fill="#F4F1FF"/><rect x="2" y="2" width="2" height="1" fill="#23203A"/><rect x="4" y="3" width="2" height="1" fill="#23203A"/><rect x="6" y="4" width="2" height="1" fill="#23203A"/><rect x="8" y="5" width="2" height="1" fill="#23203A"/><rect x="10" y="4" width="2" height="1" fill="#23203A"/><rect x="12" y="3" width="2" height="1" fill="#23203A"/><rect x="14" y="2" width="2" height="1" fill="#23203A"/><rect x="7" y="7" width="4" height="3" fill="#F38BA3"/></svg></div>
  <div class="shadow-small"></div>
  <div id="particles-small" class="particles" aria-hidden="true"></div>
  <div id="coinfly-small" class="coinfly" aria-hidden="true"></div>
  <div id="fx-small" class="pet-fx"><svg id="sprite-small" class="sprite" width="96" height="96" viewBox="0 0 64 64" role="img" aria-label="펫"></svg></div>
  <div class="coin-pill">
    <svg width="10" height="10" viewBox="0 0 64 64" aria-hidden="true"><rect x="16" y="12" width="32" height="40" fill="#F5C451"/><rect x="12" y="16" width="40" height="32" fill="#F5C451"/><rect x="24" y="20" width="16" height="24" fill="#D9A33A"/><rect x="28" y="24" width="8" height="16" fill="#F5C451"/></svg>
    <span id="coins-small">0</span>
  </div>
</section>

<!-- 펼친 위젯 300×390 -->
<section id="expanded" class="expanded-view">
  <header class="row">
    <div class="row gap8">
      <span id="name" class="pixel name">모찌</span>
      <span id="level" class="pixel badge">LV.1</span>
    </div>
    <div class="row gap6">
      <div class="coin-pill large">
        <svg width="14" height="14" viewBox="0 0 64 64" aria-hidden="true"><rect x="16" y="12" width="32" height="40" fill="#F5C451"/><rect x="12" y="16" width="40" height="32" fill="#F5C451"/><rect x="24" y="20" width="16" height="24" fill="#D9A33A"/><rect x="28" y="24" width="8" height="16" fill="#F5C451"/></svg>
        <span id="coins" class="pixel">0</span>
      </div>
      <button id="mail-btn" class="icon-btn mail-btn hidden" type="button" aria-label="PR 우편함"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="1" y="3" width="12" height="9" fill="currentColor"/><rect x="2" y="4" width="10" height="7" fill="#23203A"/><rect x="3" y="5" width="2" height="1" fill="currentColor"/><rect x="5" y="6" width="1" height="1" fill="currentColor"/><rect x="6" y="7" width="2" height="1" fill="currentColor"/><rect x="8" y="6" width="1" height="1" fill="currentColor"/><rect x="9" y="5" width="2" height="1" fill="currentColor"/></svg><span id="mail-count" class="mail-dot hidden">0</span></button>
      <button id="stats-btn" class="icon-btn" type="button" aria-label="최근 7일 기록"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="7" width="2" height="5" fill="currentColor"/><rect x="6" y="3" width="2" height="9" fill="currentColor"/><rect x="10" y="5" width="2" height="7" fill="currentColor"/></svg></button>
      <button id="collapse" class="icon-btn" type="button" aria-label="접기">×</button>
    </div>
  </header>

  <div id="stage" class="stage pet-host">
    <svg id="stage-bg" class="stage-bg" viewBox="0 0 80 44" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
    <div id="speech" class="speech">…</div>
    <div class="shadow-large"></div>
    <div id="particles-large" class="particles" aria-hidden="true"></div>
    <div id="fx-large" class="pet-fx"><svg id="sprite-large" class="sprite" width="128" height="128" viewBox="0 0 64 64" role="img" aria-label="펫"></svg></div>
  </div>

  <div class="bars">
    <div class="bar-row">
      <span class="bar-label">배고픔</span>
      <div class="bar"><div id="hunger-bar" class="fill hunger"></div></div>
      <span id="hunger-val" class="pixel bar-val">0</span>
    </div>
    <div class="bar-row">
      <span class="bar-label">기분</span>
      <div class="bar"><div id="mood-bar" class="fill mood"></div></div>
      <span id="mood-val" class="pixel bar-val">0</span>
    </div>
  </div>
  <p id="forecast" class="forecast hidden"></p>

  <div class="actions">
    <button id="feed" class="btn primary" type="button">먹이주기 <span id="feed-cost" class="pixel cost">-50</span></button>
    <button id="dress" class="btn ghost" type="button">꾸미기</button>
  </div>

  <footer class="row foot">
    <span id="turn">이번 턴 +0 코인</span>
    <span id="fed">마지막 식사 -</span>
  </footer>
  <section id="dress-panel" class="dress-panel hidden" aria-label="꾸미기">
    <header class="row">
      <span class="pixel name">꾸미기</span>
      <div class="row gap6">
        <div class="coin-pill large">
          <svg width="14" height="14" viewBox="0 0 64 64" aria-hidden="true"><rect x="16" y="12" width="32" height="40" fill="#F5C451"/><rect x="12" y="16" width="40" height="32" fill="#F5C451"/><rect x="24" y="20" width="16" height="24" fill="#D9A33A"/><rect x="28" y="24" width="8" height="16" fill="#F5C451"/></svg>
          <span id="coins-dress" class="pixel">0</span>
        </div>
        <button id="dress-close" class="icon-btn" type="button" aria-label="꾸미기 닫기">×</button>
      </div>
    </header>
    <div class="tabs" role="tablist" aria-label="꾸미기 종류">
      <button id="tab-wear" class="tab" type="button" role="tab" data-tab="wear" aria-selected="true">상점</button>
      <button id="tab-bg" class="tab" type="button" role="tab" data-tab="bg" aria-selected="false">배경</button>
      <button id="tab-dex" class="tab" type="button" role="tab" data-tab="dex" aria-selected="false">도감</button>
    </div>
    <div id="dress-note" class="dress-note hidden"></div>
    <ul id="dress-list" class="dress-list"></ul>
  </section>
  <section id="mail-panel" class="dress-panel hidden" aria-label="PR 우편함">
    <header class="row">
      <span class="pixel name">리뷰 요청</span>
      <div class="row gap6">
        <button id="mail-close" class="icon-btn" type="button" aria-label="우편함 닫기">×</button>
      </div>
    </header>
    <p id="mail-note" class="dress-note hint hidden"></p>
    <ul id="mail-list" class="dress-list"></ul>
  </section>
  <section id="stats-panel" class="dress-panel hidden" aria-label="최근 7일 기록">
    <header class="row">
      <span class="pixel name">기록</span>
      <button id="stats-close" class="icon-btn" type="button" aria-label="기록 닫기">×</button>
    </header>
    <p id="stats-today" class="stats-today"></p>
    <div class="chart-wrap">
      <svg id="stats-chart" class="chart" width="268" height="84" viewBox="0 0 268 84" role="img" aria-label="최근 7일 번 코인"></svg>
      <div id="chart-tip" class="chart-tip hidden"></div>
    </div>
    <p id="stats-total" class="stats-total"></p>
  </section>
  <div id="toast" class="toast hidden"></div>
  <div id="coinfly-large" class="coinfly" aria-hidden="true"></div>
</section>

<script type="module" src="app.js"></script>
</body>
</html>
