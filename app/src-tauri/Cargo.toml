[package]
name = "token-pet"
version = "0.1.0"
description = "Token Pet desktop widget"
authors = ["arazo"]
edition = "2021"

[lib]
name = "token_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
tauri-plugin-notification = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
